.nv-top .b{color:var(--accent);font-size:28px;cursor:pointer;min-width:30px}.nv-url{font-size:13px;color:#555;background:#f1f1f3;padding:4px 14px;border-radius:12px}
.nv-logo{text-align:center;color:#03c75a;font-weight:900;font-size:34px;letter-spacing:1px;margin:30px 0 18px;font-family:Arial,sans-serif}
.nv-box{display:flex;align-items:center;gap:10px;margin:0 16px 16px;border:2px solid #03c75a;border-radius:26px;padding:10px 14px}
.nv-n{background:#03c75a;color:#fff;font-weight:900;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:Arial}
.nv-ph{flex:1;color:#b0b0b5;font-size:15px}.nv-g{color:#03c75a}
.nv-h{display:flex;justify-content:space-between;padding:10px 18px;font-size:14px;border-top:8px solid #f4f5f7}.nv-h span{color:var(--sub);font-size:13px}
.nv-q{display:flex;align-items:center;gap:10px;padding:11px 18px}.nv-ic{font-size:14px;opacity:.5}.nv-t{flex:1;font-size:15px}.nv-x{color:#c7c7cc;font-size:13px}
.nv-f{display:flex;justify-content:space-between;padding:14px 18px;color:var(--sub);font-size:13px;border-top:1px solid var(--line);margin-top:6px}
.seg{display:flex;background:#eeeef0;border-radius:9px;padding:2px}.seg span{padding:4px 16px;font-size:13px;border-radius:7px;cursor:pointer}
.seg span.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#scr-music{background:#121212;color:#fff}
.pl-nav .b{color:#fc3c44}
.pl{padding-bottom:80px}.pl-head{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px}
.pl-cv{border-radius:6px;flex:none}.pl-head .pl-cv{border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pl-name{font-size:20px;font-weight:700;margin-top:12px}.pl-sub{font-size:13px;color:#999;margin-top:2px}
.pl-btns{display:flex;gap:12px;margin-top:14px}.pl-btns span{background:#2a2a2a;color:#fc3c44;font-weight:600;font-size:14px;padding:9px 30px;border-radius:9px}
.pl-row{display:flex;align-items:center;gap:12px;padding:7px 16px;cursor:pointer}.pl-row.on b{color:#fc3c44}
.pl-m{flex:1;min-width:0;display:flex;flex-direction:column}.pl-m b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-m span{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl-more{color:#aaa;font-size:18px}
.pl-mini{position:absolute;left:8px;right:8px;bottom:26px;display:flex;align-items:center;gap:10px;background:#2a2a2c;border-radius:14px;padding:8px 12px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.pl-c{font-size:20px;padding:0 6px;cursor:pointer}
#call{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;color:#fff;padding-top:118px;transition:opacity .4s;
  background:linear-gradient(160deg,#a85a52 0%,#9a4f4f 22%,#6e5560 45%,#2f5670 70%,#0f3f5c 100%)}
#call:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 40% at 100% 0%,rgba(196,140,60,.75),transparent 70%);pointer-events:none}
#call>*{position:relative}
#call.on{display:flex}#call.fade{opacity:0}
#call .c-st{font-size:17px;font-weight:600;color:rgba(255,255,255,.62);min-height:24px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#call .c-nm{font-size:30px;font-weight:500;letter-spacing:-.3px;margin-top:4px}
#call .c-sub{margin-top:46px;min-height:56px;padding:0 30px;text-align:center;font-size:16px;line-height:1.4}
#call .c-sub span{background:rgba(0,0,0,.28);padding:6px 13px;border-radius:12px;display:inline-block}
#call .c-grid{margin-top:auto;display:grid;grid-template-columns:repeat(3,84px);gap:20px 32px;justify-items:center;margin-bottom:34px}
#call .c-b{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#fff}
#call .c-b i{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.38);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;font-style:normal;box-sizing:border-box}
#call .c-b.end i{background:#e3191e;border-color:rgba(255,255,255,.3);cursor:pointer;transition:background .12s,transform .12s,filter .12s}
#call .c-b.end.pressed i{background:#8f0f13;transform:scale(.93);filter:brightness(.8)}
#call .c-bot{height:40px}
#banner{position:absolute;left:8px;right:8px;top:8px;z-index:58;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:22px;
  background:rgba(245,245,247,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#111;box-shadow:0 8px 30px rgba(0,0,0,.25);
  transform:translateY(-140%);transition:transform .38s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
#banner.on{transform:translateY(0)}
#banner .ic{width:36px;height:36px;border-radius:9px;background:linear-gradient(#65e073,#2cc840);flex:none;display:flex;align-items:center;justify-content:center}
#banner .tx{flex:1;min-width:0}#banner .tt{display:flex;justify-content:space-between;font-size:14px}#banner .tt b{font-weight:700}#banner .tt span{color:#666;font-size:13px}
#banner p{font-size:14px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icon.folder{background:rgba(255,255,255,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(3,14px);gap:4px;
  align-content:center;justify-content:center;padding:0;box-shadow:none}
.gi{flex:none;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#folder{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  background:rgba(0,0,0,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:opacity .25s}
#folder.on{opacity:1;pointer-events:auto}
#folder .fd-name{color:#fff;font-size:28px;font-weight:700;margin-bottom:22px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
#folder .fd-box{width:300px;padding:26px 18px;border-radius:38px;background:rgba(255,255,255,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px;justify-items:center;transform:scale(.85);transition:transform .25s}
#folder.on .fd-box{transform:scale(1)}
#folder .app{width:80px;color:#fff}#folder .app span{font-size:12px}
#lock{position:absolute;inset:0;z-index:60;color:#fff;background-size:cover;background-position:center;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .35s ease, opacity .35s ease;display:flex;flex-direction:column;align-items:center}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#lock .lk-top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0 30px;font-weight:600;font-size:15px}
#lock .lk-top .r{display:flex;gap:6px;align-items:center}
#lock .lk-pad{margin-top:14px;opacity:.95}
#lock .lk-date{font-size:21px;font-weight:600;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.2)}
#lock .lk-time{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:2px;text-shadow:0 2px 12px rgba(0,0,0,.18);font-family:-apple-system,"SF Pro Display","Noto Sans KR",sans-serif}
#lock .lk-noti{margin-top:auto;width:calc(100% - 20px);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:22px;
  background:rgba(245,245,245,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#111}
#lock .lk-noti .ic{width:36px;height:36px;border-radius:9px;background:linear-gradient(#65e073,#2cc840);flex:none;display:flex;align-items:center;justify-content:center}
#lock .lk-noti .tx{flex:1;min-width:0}#lock .lk-noti .tt{display:flex;justify-content:space-between;font-size:14px}
#lock .lk-noti .tt b{font-weight:700}#lock .lk-noti .tt span{color:#444;font-size:13px}#lock .lk-noti p{font-size:14px;margin-top:1px}
#lock .lk-bot{width:100%;display:flex;justify-content:space-between;align-items:center;padding:22px 46px 0}
#lock .ls-btn{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
#lock .lk-hint{font-size:14px;font-weight:500;opacity:.9;margin:14px 0 10px;animation:lkhint 2.4s ease-in-out infinite;cursor:pointer}
@keyframes lkhint{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-5px);opacity:.6}}
#lock .lk-bar{width:134px;height:5px;border-radius:3px;background:#fff;margin-bottom:8px}
.call{display:flex;align-items:center;gap:6px;padding:9px 16px 9px 6px;border-bottom:1px solid var(--line)}
.call .ci{width:16px;flex:none;display:flex;justify-content:center}
.call .cm{flex:1;min-width:0;display:flex;flex-direction:column}.call .cm b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .cm span{color:var(--sub);font-size:13px}.call.missed .cm b{color:#ff3b30}
.call .ct{color:var(--sub);font-size:14px}.call .cinfo{color:var(--accent);font-size:20px;margin-left:4px}
</style>
</head>

function appIcon(a, withLabel = true){
  if (a.folder){ const idx=P.apps.indexOf(a);
    return `<div class="app" onclick="openFolder(${idx})"><div class="icon folder">${a.folder.slice(0,9).map(x=>gameIcon(x.g,14)).join("")}</div>${withLabel ? `<span>${esc(a.label)}</span>` : ""}</div>`; }
  if (a.blank) return `<div class="app" style="visibility:hidden"><div class="icon"></div><span>&nbsp;</span></div>`;
  const [bg, svg] = ICONS[a.icon] || ICONS.settings;
  const inner = a.img
    ? `<img src="${esc(a.img)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:15px">`
    : `<svg viewBox="0 0 100 100" width="100%" height="100%">${svg}</svg>`;
  const open = a.open ? `open_('${a.open}')` : `open_('empty','${esc(a.label)}')`;
  return `<div class="app" onclick="${open}"><div class="icon" style="background:${a.img ? 'transparent' : bg}">${inner}
    ${a.badge ? `<div class="badge">${a.badge}</div>` : ""}</div>${withLabel ? `<span>${esc(a.label)}</span>` : ""}</div>`;
}

let callT=[], actx=null, callTimer=null;
function tone(freqs, start, dur, vol){
  if(!actx) return;
  const g=actx.createGain(); g.gain.setValueAtTime(0,actx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol,actx.currentTime+start+.02);
  g.gain.setValueAtTime(vol,actx.currentTime+start+dur-.03); g.gain.linearRampToValueAtTime(0,actx.currentTime+start+dur);
  g.connect(actx.destination);
  freqs.forEach(f=>{ const o=actx.createOscillator(); o.frequency.value=f; o.connect(g); o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur); });
}

  let tt=S.ring*1000;
  callT.push(setTimeout(()=>{ const t0=Date.now(), st=$("cst"); st.textContent="00:00";
    callTimer=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); st.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`; },200); }, tt));
  tt+=1000;
  S.lines.forEach(([txt,show,gap])=>{
    callT.push(setTimeout(()=>{ $("csub").innerHTML=`<span>${esc(S.speaker||S.name)}: ${esc(txt)}</span>`; }, tt));
    tt+=show*1000;
    if(gap>0) callT.push(setTimeout(()=>{ const c=$("csub"); if(c) c.innerHTML=""; }, tt));
    tt+=gap*1000;
  });
  callT.push(setTimeout(()=>endCall(true), tt));
}
function endCall(auto){
  callT.forEach(clearTimeout); callT=[];
  const C=$("call"); if(!C.classList.contains("on") || C.dataset.ending) return;
  C.dataset.ending="1";
  const btn=C.querySelector(".c-b.end"); if(btn) btn.classList.add("pressed");
  setTimeout(()=>finishCall(C), auto ? 450 : 250);
}
function finishCall(C){
  clearInterval(callTimer); delete C.dataset.ending;
  tone([620],0,.12,.12); tone([480],.16,.16,.12);
  $("csub").innerHTML=""; $("cst").textContent="통화 종료";
  const S=P.callScript;
  if(!P.calls[0] || P.calls[0]._live!==true){ P.calls.unshift({name:S.name, type:"out", time:P.time, _live:true}); }
  setTimeout(()=>{ C.classList.add("fade"); setTimeout(()=>{ C.className=""; $("status").style.zIndex=""; status(false); renderCalls(false); afterCallMsgs(); },400); }, 1200);
}

/* 📩 통화 후 문자 + 상단 알림 */
let bannerT=null, afterDone=false;
function showBanner(name, text){
  const B=$("banner");
  B.innerHTML=`<div class="ic"><svg viewBox="0 0 100 100" width="24" height="24"><ellipse cx="50" cy="47" rx="34" ry="27" fill="#fff"/><path d="M28 64 L22 80 L42 70Z" fill="#fff"/></svg></div>
    <div class="tx"><div class="tt"><b>${esc(name)}</b><span>지금</span></div><p>${esc(text)}</p></div>`;
  B.classList.remove("on"); void B.offsetWidth; B.classList.add("on");
  clearTimeout(bannerT); bannerT=setTimeout(()=>B.classList.remove("on"), 3200);
}
function bannerOpen(){
  $("banner").classList.remove("on");
  const i=P.chats.findIndex(c=>c.name===P.callScript.name);
  if(i>=0){ goHome(); open_("chat"); openRoom(i); }
}
function afterCallMsgs(){
  const S=P.callScript; if(afterDone || !S || !S.after) return; afterDone=true;
  const i=P.chats.findIndex(c=>c.name===S.name); if(i<0) return; const c=P.chats[i];
  c._pending = S.after.length;
  S.after.forEach((t,k)=>setTimeout(()=>{
    c.messages.push({from:"them", text:t, time:nowTime()}); c.time=P.time; c._pending--;
    const viewing = roomIdx===i && stack.includes($("scr-room"));
    if(viewing) refreshRoom(i, c._pending>0); else c.unread=(c.unread||0)+1;
    renderMsgList(); renderHome();
    if(!viewing) showBanner(c.name, t);
  }, 1200 + k*2000));
}

function show(id){ const el=$("scr-"+id); el.classList.add("open"); stack.push(el); status(false); }
function back(){ const el=stack.pop(); if(el) el.classList.remove("open"); if(!stack.length) status(true); }
function goHome(){ closeFolder(); while(stack.length) back(); $("viewer").style.display="none"; }
const nav = (title, left="‹ 홈") => `<div class="nav"><span class="b" onclick="back()">${left}</span><h2>${title}</h2><span style="min-width:60px"></span></div>`;

function open_(app, label){
  if(app==="chat"){
    renderMsgList(); show("chat");
  } else if(app==="cal"){
    renderCal(today.getDate()); show("cal");
  } else if(app==="music"){
    renderMusic(); show("music");
  } else if(app==="memo"){
    $("scr-memo").innerHTML = nav("") + `<div class="big">메모</div><div class="scroll">` +
      P.memos.map((m,i)=>`<div class="row" onclick="openMemo(${i})" style="border-bottom:1px solid var(--line)"><div class="mid"><b>${esc(m.title)}</b><p>${esc(m.date)} · ${m.lock ? "🔒 잠김" : esc(m.body.split("\n")[0])}</p></div></div>`).join("") + `<div class="credit">© 세로, 2026. All rights reserved.<br>Created with AI assistance and edited by Claude.<br><a href="https://www.postype.com/@from-march" target="_blank" rel="noopener">https://www.postype.com/@from-march</a></div></div>`;
    show("memo");
  } else if(app==="photo"){
    $("scr-photo").innerHTML = nav("") + `<div class="big">사진</div><div class="scroll"><div class="photos">` +
      P.photos.map((p,i)=>{ const u=p.src||PHOTO_DATA[i]; return `<div style="position:relative;${u?`background-image:url('${u}')`:`background:${photoColors[i%9]}`}">${p.fav?'<svg class="fav" viewBox="2 3 20 18.4"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fff"/></svg>':''}</div>`; }).join("") + `</div></div>`;
    show("photo");
  } else if(app==="naver"){
    $("scr-naver").innerHTML = `<div class="nv-top"><span class="b" onclick="back()">‹</span><span class="nv-url">🔒 m.naver.com</span><span></span></div>
      <div class="nv-logo">NAVER</div>
      <div class="nv-box"><span class="nv-n">N</span><span class="nv-ph">검색어를 입력해 주세요.</span><span class="nv-g">🔍</span></div>
      <div class="scroll"><div class="nv-h"><b>최근 검색어</b><span>전체삭제</span></div>` +
      P.searches.map(q=>`<div class="nv-q"><span class="nv-ic">🕘</span><span class="nv-t">${esc(q)}</span><span class="nv-x">✕</span></div>`).join("") +
      `<div class="nv-f"><span>자동저장 끄기</span><span>닫기</span></div></div>`;
    show("naver");
  } else if(app==="mail"){
    renderMailList(); show("mail");
  } else if(app==="phone"){
    renderCalls(false); show("phone");
  } else {
    $("scr-empty").innerHTML = nav(label) + `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub)">🔒 잠겨 있는 앱입니다</div>`;
    show("empty");
  }
}
const avatar = (n, cls="") => `<div class="im-av ${cls}">${/^[(0-9]/.test(n) ? '<svg viewBox="0 0 40 40" width="60%"><circle cx="20" cy="14" r="8" fill="#fff"/><path d="M5 38c2-9 8-13 15-13s13 4 15 13z" fill="#fff"/></svg>' : esc(n.replace(/[^가-힣A-Za-z]/g,"")[0]||"?")}</div>`;
function renderMsgList(){
  $("scr-chat").innerHTML = nav("") + `<div class="big">메시지</div><div class="search">🔍 검색</div><div class="scroll">` +
    P.chats.map((c,i)=>`<div class="im-row" onclick="openRoom(${i})"><div class="ud">${c.unread?'<i></i>':''}</div>${avatar(c.name)}
      <div class="mb"><div class="top"><b>${esc(c.name)}</b><span>${esc(c.time)} ›</span></div>
      <div class="pv">${(()=>{const l=c.messages.filter(m=>m.text||m.img).slice(-1)[0]; return l ? (l.img ? '사진' : esc(l.text)) : '';})()}</div></div></div>`).join("") + `</div>`;
}
function buildMsgs(c, typing){
  let prev=null, html="";
  c.messages.forEach((m,k)=>{
    if(m.day){ const nx=c.messages.slice(k+1).find(x=>x.time); html+=`<div class="im-day"><b>${esc(m.day)}</b> ${nx?esc(nx.time):""}</div>`; prev=null; return; }
    if(m.spacer){ html+=`<div class="im-day im-sp">${esc(m.spacer)}</div>`; prev=null; return; }
    const inner = m.img ? `<img class="im-img" src="${CHAT_IMG[m.img]||esc(m.img)}" alt="">` : `<p>${esc(m.text)}</p>`;
    html+=`<div class="im-m ${m.from==='me'?'me':''} ${prev&&prev!==m.from?'gap':''}">${inner}</div>`; prev=m.from;
  });
  const last=c.messages.filter(m=>m.text||m.img).slice(-1)[0];
  if(typing) html+=`<div class="im-m ${prev==='me'?'gap':''}"><p class="im-typing"><i></i><i></i><i></i></p></div>`;
  else if(last && last.from==="me") html+=`<div class="im-read">읽음</div>`;
  return html;
}
let roomIdx=-1;
function openRoom(i){
  roomIdx=i;
  const c=P.chats[i]; c.unread=0; renderMsgList(); renderHome();
  $("scr-room").innerHTML = `<div class="im-head"><span class="b" onclick="back()">‹</span><div class="im-hc">${avatar(c.name,"sm")}<div class="nm">${esc(c.name)} ›</div></div><span class="b"></span></div>
    <div class="msgs im" id="msgs">${buildMsgs(c, (c._pending||0)>0)}</div>
    <div class="im-input"><span class="plus">＋</span><input id="imtxt" placeholder="iMessage" autocomplete="off" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();sendMsg(${i})}"><span class="im-send" onclick="sendMsg(${i})">↑</span></div>`;
  show("room"); setTimeout(()=>{const m=$("msgs"); m.scrollTop=m.scrollHeight;},50);
}
function refreshRoom(i, typing){
  if(roomIdx!==i) return;
  const m=$("msgs"); if(!m) return; m.innerHTML=buildMsgs(P.chats[i], typing); m.scrollTop=m.scrollHeight;
}
function nowTime(){ const [h,mi]=P.time.split(":").map(Number); return `${h<12?"오전":"오후"} ${h%12||12}:${String(mi).padStart(2,"0")}`; }
function sendMsg(i){
  const inp=$("imtxt"), t=inp.value.trim(); if(!t) return;
  const c=P.chats[i]; inp.value="";
  c.messages.push({from:"me", text:t, time:nowTime()}); c.time=P.time;
  refreshRoom(i); renderMsgList();
  const R=c.replies||[]; if(!R.length) return;
  c._r=(c._r||0); const r=R[Math.min(c._r, R.length-1)]; c._r++;
  const queue = Array.isArray(r) ? r.slice() : [r];
  (c._q = c._q || []).push(...queue);
  if(c._busy) return;
  c._busy = true;
  const next = () => {
    if(!c._q.length){ c._busy=false; return; }
    const reply = c._q.shift();
    setTimeout(()=>refreshRoom(i,true), 700);
    setTimeout(()=>{ c.messages.push({from:"them", text:reply, time:nowTime()}); refreshRoom(i); renderMsgList(); next(); }, 700+Math.min(2200, 600+reply.length*90));
  };
  next();
}
function openMemo(i, unlocked){
  const m=P.memos[i];
  if(m.lock && !unlocked){
    $("scr-memodetail").innerHTML = nav("","‹ 메모") + `<div class="lk">
      <div class="lk-ic">🔒</div><div class="lk-t">${esc(m.title)}</div><div class="lk-s">이 메모는 잠겨 있습니다.</div>
      <input id="lkpw" class="lk-in" type="password" inputmode="numeric" placeholder="암호 입력" onkeydown="if(event.key==='Enter')tryMemo(${i})">
      <div class="lk-err" id="lkerr"></div>
      <div class="lk-btn" onclick="tryMemo(${i})">확인</div>
      <div class="lk-h">비밀번호 힌트: ${esc(m.hint||"")}</div></div>`;
    if(!stack.includes($("scr-memodetail"))) show("memodetail");
    return;
  }
  $("scr-memodetail").innerHTML = nav("","‹ 메모") + `<div class="scroll"><div class="memo-date">${esc(m.date)}</div><div class="big">${esc(m.title)}</div><div class="memo-body">${esc(m.body)}</div></div>`;
  if(!stack.includes($("scr-memodetail"))) show("memodetail");
}
function tryMemo(i){
  const v=$("lkpw").value;
  if(v===P.memos[i].lock) openMemo(i,true);
  else { $("lkerr").textContent="암호가 올바르지 않습니다."; $("lkpw").value=""; }
}
function viewPhoto(i){

  v.style.display="flex";
}
const COVERS=["#8a9bb0,#3d4a5c","#c8b48a,#6b5a3a","#5a6b5a,#2a3a2a","#1a1a2a,#4a4a6a","#b8c4d4,#6a7a8a","#9a9a7a,#4a4a3a",
  "#e8e8e8,#aaaaaa","#c47a6a,#4a2a2a","#d8d4c8,#8a867a","#f0f0f0,#3a5aa8","#d4b8a8,#7a5a4a","#7ab8d8,#c86a9a"];
const cover = (i,size) => `<div class="pl-cv" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,${COVERS[i%COVERS.length]})"></div>`;
let nowIdx = -1;
function renderMusic(){
  const np = nowIdx<0 ? P.music : P.playlist[nowIdx];

}
function renderCalls(onlyMissed){
  const list = P.calls.filter(c=>!onlyMissed || c.type==="missed");

    list.map(c=>`<div class="call ${c.type}" ${P.callScript && c.name===P.callScript.name ? `onclick="startCall()" style="cursor:pointer"` : ""}><span class="ci">${c.type==="out"?'<svg viewBox="0 0 24 24" width="13" height="13"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="#8e8e93"/></svg>':''}</span>
      <div class="cm"><b>${esc(c.name)}${c.count?` (${c.count})`:''}</b><span>${esc(c.label||"휴대전화")}</span></div>
      <span class="ct">${esc(c.time)}</span><span class="cinfo">ⓘ</span></div>`).join("") + `</div>`;

function renderCal(sel){
  const Y=2026, M=9, first=new Date(Y,M,1).getDay(), last=new Date(Y,M+1,0).getDate(), td=today.getDate();
  const ev = d => P.calendar.filter(e => { const a=dnum(e.date), b=e.end?dnum(e.end):a; return +e.date.split("/")[0]===M+1 && d>=a && d<=b; });
  let cells = "";
  for(let i=0;i<first;i++) cells += `<div class="cd"></div>`;
  for(let d=1; d<=last; d++){
    const dow=(first+d-1)%7, cls = d===td ? "today" : (d===sel ? "sel" : "");
    cells += `<div class="cd" onclick="renderCal(${d})"><span class="n ${cls} ${dow===0||dow===6?'we':''}">${d}</span>` +
      ev(d).map(e=>`<div class="ce" style="background:${e.color}26;color:${e.color}">${esc(e.title)}</div>`).join("") + `</div>`;
  }
  const list = ev(sel);
  $("scr-cal").innerHTML = `<div class="nav"><span class="b" style="color:#ff3b30" onclick="back()">‹ 2026년</span><span></span>
      <span style="color:#ff3b30;font-size:20px;letter-spacing:14px">⌕＋</span></div>
    <div class="scroll"><div class="big" style="padding-bottom:4px">10월</div>
    <div class="wk">${"일월화수목금토".split("").map(w=>`<span>${w}</span>`).join("")}</div>
    <div class="cg">${cells}</div>
    <div class="cl-h">10월 ${sel}일 ${days[new Date(Y,M,sel).getDay()]}</div>` +
    (list.length ? list.map(e=>`<div class="cal-item"><i style="background:${e.color}"></i><div><b>${esc(e.title)}</b><span>${e.end ? e.date+" – "+e.end : e.time}</span></div></div>`).join("")
      : `<div class="cl-none">일정 없음</div>`) +
    `</div><div class="cal-bar"><span>오늘</span><span>캘린더</span><span>받은 편지함</span></div>`;
}
function renderMailList(){
  const n = P.mails.filter(m=>m.unread).length;
  $("scr-mail").innerHTML = nav("") + `<div class="big">받은 편지함</div><div class="mail-sub">${esc(P.me.email)} · 읽지 않음 ${n}개</div><div class="scroll">` +

      <div class="sj">${esc(m.subject)}</div><div class="pv">${esc(m.body.replace(/\n+/g," "))}</div></div></div>`).join("") + `</div>`;

  const m=P.mails[i]; m.unread=false; renderMailList();

  $("scr-maildetail").innerHTML = nav("","‹ 받은 편지함") + `<div class="scroll"><div class="md-subject">${esc(m.subject)}</div>
    <div class="md-head"><div class="av">${esc(m.from.trim()[0])}</div><div><b>${esc(m.from)}</b>
    <p>보낸 사람: ${esc(m.email)}<br>받는 사람: ${m.to ? esc(m.to) : `${esc(P.me.name)} ${esc(P.me.title)} &lt;${esc(P.me.email)}&gt;`}<br>${esc(m.time)}${m.at ? " " + esc(m.at) : ""}</p></div></div>
    <div class="md-body">${esc(m.body)}</div></div>`;

}
